{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Box - Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow-y: auto;
    font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Floating orbs effect */
body::before {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.1), transparent 50%);
    border-radius: 50%;
    top: -100px;
    left: -100px;
    animation: float 8s ease-in-out infinite;
    z-index: -1;
}

body::after {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle at 70% 60%, rgba(255,255,255,0.08), transparent 50%);
    border-radius: 50%;
    bottom: -100px;
    right: -100px;
    animation: float 10s ease-in-out infinite reverse;
    z-index: -1;
}

@keyframes float {
    0%, 100% { transform: translateY(0px) translateX(0px); }
    50% { transform: translateY(30px) translateX(-20px); }
}

/* LAYOUT */
.main-container {
    display: flex;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    align-items: center;
    justify-content: center;
    gap: 40px;
}

/* LEFT SIDE */
.left-side {
    flex: 1;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 1;
}

.left-side h1 {
    font-size: 3.5rem;
    font-weight: 800;
    margin-bottom: 10px;
    text-shadow: 0 10px 30px rgba(0,0,0,0.3);
    background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.left-side p {
    font-size: 1.3rem;
    font-weight: 300;
    text-shadow: 0 5px 15px rgba(0,0,0,0.2);
    margin-bottom: 40px;
    color: rgba(255,255,255,0.95);
}

.chat-bubble {
    width: 50px;
    height: 50px;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    margin: 15px;
    animation: pulse 2s infinite;
    display: inline-block;
}

.chat-bubble:nth-child(1) { animation-delay: 0s; }
.chat-bubble:nth-child(2) { animation-delay: 0.3s; }
.chat-bubble:nth-child(3) { animation-delay: 0.6s; }

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.2); opacity: 1; }
}

/* RIGHT SIDE */
.right-side {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
    max-width: 500px;
}

/* GLASS CARD */
.card {
    width: 100%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 25px 50px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.2);
    animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    padding: 40px !important;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(50px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.card h3 {
    color: white;
    font-weight: 700;
    font-size: 1.8rem;
    margin-bottom: 30px;
    text-align: center;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}

/* INPUTS */
.form-control {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 12px;
    color: white;
    padding: 12px 16px;
    font-size: 1rem;
    margin-bottom: 12px;
    transition: all 0.3s ease;
}

.form-control:focus {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.5);
    color: white;
    box-shadow: 0 0 20px rgba(255,255,255,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
}

.form-control::placeholder {
    color: rgba(255,255,255,0.7);
    opacity: 1;
}

.form-control::-webkit-input-placeholder {
    color: rgba(255,255,255,0.7);
}

/* BUTTON */
.btn-gold {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    color: white;
    font-weight: 600;
    font-size: 1rem;
    padding: 12px 30px;
    border-radius: 12px;
    width: 100%;
    transition: all 0.3s ease;
    margin-top: 15px;
}

.btn-gold:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
    background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    color: white;
}

.btn-gold:active {
    transform: translateY(-1px);
}

/* LINKS */
.card a {
    color: rgba(255,255,255,0.9);
    text-decoration: none;
    transition: all 0.3s ease;
    font-weight: 500;
}

.card a:hover {
    color: white;
    text-decoration: underline;
}

.alert-danger {
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid rgba(239, 68, 68, 0.5);
    color: rgba(255,200,200,1);
    border-radius: 12px;
}

/* MOBILE */
@media(max-width: 1024px) {
    .main-container {
        flex-direction: column;
        gap: 30px;
    }
    
    .left-side {
        display: none;
    }
    
    .right-side {
        max-width: 100%;
        width: 100%;
    }
}

@media(max-width: 768px) {
    .card {
        max-width: 400px;
    }
    
    .left-side h1 {
        font-size: 2rem;
    }
}
</style>
</head>

<body>

<div class="main-container">

<!-- LEFT -->
<div class="left-side">
    
    <img src="{% static 'images/logo.png' %}" width="120" alt="Chat Box logo" style="filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));">
    <h1>Chat Box</h1>
    <p>Connect. Chat. Share instantly.</p>
    <div style="margin-top: 40px;">
        <div class="chat-bubble"></div>
        <div class="chat-bubble"></div>
        <div class="chat-bubble"></div>
    </div>
</div>

<!-- RIGHT -->
<div class="right-side">
<div class="card">

<h3>Create Your Account</h3>

{% if error %}
<div class="alert alert-danger">
    <i class="fas fa-exclamation-circle"></i> {{ error }}
</div>
{% endif %}

<form method="POST">
{% csrf_token %}

<input class="form-control" name="username" placeholder="👤 Username" required>
<input class="form-control" type="password" name="password" placeholder="🔐 Password" required>
<input class="form-control" name="full_name" placeholder="📝 Full Name" required>
<input class="form-control" type="email" name="email" placeholder="✉️ Email" required>
<input class="form-control" name="phone" placeholder="📱 Phone Number" required>
<textarea class="form-control" name="bio" placeholder="✍️ Bio (Optional)" style="resize: vertical; min-height: 80px;"></textarea>

<button type="submit" class="btn btn-gold">
    <i class="fas fa-user-plus"></i> Create Account
</button>
</form>

<div style="margin-top: 25px; text-align: center; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px;">
    <p style="color: rgba(255,255,255,0.8); margin-bottom: 10px;">
        Already have an account?
        <br>
        <a href="{% url 'login' %}">Login Here</a>
    </p>
</div>

</div>
</div>

</div>

</body>
</html>
