{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Admin Panel{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* ===================== ROOT ===================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 40%, #cbd5e1 100%);
    background-attachment: fixed;
    color: #111827;
    overflow-x: hidden;
    min-height: 100vh;
}

/* ===================== GLOW LAYERS ===================== */
body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background:
        radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.12), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(249, 115, 22, 0.08), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.12), transparent 60%);
    animation: moveGlow 14s ease-in-out infinite alternate;
    z-index: -4;
}

@keyframes moveGlow {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(30px,20px) scale(1.05); }
}

/* ===================== GRID OVERLAY ===================== */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.15;
    z-index: -2;
}

/* ===================== ORBS ===================== */
.orb {
    position: fixed;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.12;
    z-index: -1;
    animation: floatOrb 12s ease-in-out infinite alternate;
}

.orb.one { 
    background: #3b82f6; 
    top: 10%; 
    left: 5%; 
}

.orb.two { 
    background: #1e40af; 
    bottom: 10%; 
    right: 5%; 
}

@keyframes floatOrb {
    from { transform: translateY(0px) translateX(0px); }
    to { transform: translateY(40px) translateX(30px); }
}

/* ===================== SIDEBAR ===================== */
.sidebar {
    width: 260px;
    height: 100vh;
    position: fixed;
    padding: 20px;
    background: #ffffff;
    border-right: 1px solid #e5e7eb;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    overflow-y: auto;
    z-index: 100;
}

.sidebar::-webkit-scrollbar {
    width: 6px;
}

.sidebar::-webkit-scrollbar-track {
    background: #f3f4f6;
}

.sidebar::-webkit-scrollbar-thumb {
    background: #3b82f6;
    border-radius: 10px;
}

.sidebar img {
    display: block;
    margin: 0 auto 20px;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.08));
}

.sidebar a {
    display: block;
    padding: 12px 16px;
    margin-bottom: 8px;
    text-decoration: none;
    color: #6b7280;
    border-radius: 8px;
    transition: all 0.2s ease;
    font-weight: 500;
    border-left: 3px solid transparent;
}

.sidebar a:hover {
    background: #f0f9ff;
    color: #3b82f6;
    transform: translateX(4px);
    border-left-color: #3b82f6;
}

.sidebar a.active {
    background: #f0f9ff;
    color: #3b82f6;
    border-left-color: #3b82f6;
    box-shadow: inset 0 2px 8px rgba(59, 130, 246, 0.1);
}

.sidebar a i {
    margin-right: 10px;
    width: 20px;
}

.sidebar hr {
    border-color: #e5e7eb;
    margin: 15px 0;
}

/* ===================== CONTENT ===================== */
.content {
    margin-left: 270px;
    padding: 30px;
    min-height: 100vh;
    animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===================== CARDS ===================== */
.card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    border-color: #3b82f6;
}

.card-header {
    background: #f9fafb;
    border-bottom: 1px solid #e5e7eb;
    border-radius: 12px 12px 0 0;
}

.card-title {
    color: #1f2937;
    font-weight: 700;
}

/* ===================== TABLES ===================== */
.table {
    color: #374151;
    border-color: #e5e7eb;
}

.table thead {
    background: #f9fafb;
}

.table thead th {
    color: #1f2937;
    font-weight: 700;
    border: none;
    padding: 15px;
    border-bottom: 2px solid #e5e7eb;
}

.table tbody td {
    padding: 15px;
    border: none;
    border-bottom: 1px solid #e5e7eb;
}

.table tbody tr {
    transition: all 0.2s ease;
}

.table tbody tr:hover {
    background: #f9fafb;
}

/* ===================== BUTTONS ===================== */
.btn-primary {
    background: #3b82f6;
    border: none;
    color: white;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
    transition: all 0.2s ease;
}

.btn-primary:hover {
    background: #1e40af;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
    color: white;
}

.btn-danger {
    background: #ef4444;
    border: none;
    color: white;
    font-weight: 600;
    transition: all 0.2s ease;
}

.btn-danger:hover {
    background: #dc2626;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(239, 68, 68, 0.25);
    color: white;
}

.btn-info {
    background: #0891b2;
    border: none;
    color: white;
    font-weight: 600;
    transition: all 0.2s ease;
}

.btn-info:hover {
    background: #0e7490;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(8, 145, 178, 0.25);
    color: white;
}

.btn-sm {
    padding: 6px 12px;
    font-size: 0.85rem;
}

/* ===================== HEADINGS ===================== */
h1, h2, h3 {
    color: #1f2937;
    font-weight: 700;
}

h4, h5, h6 {
    color: #374151;
    font-weight: 600;
}

/* ===================== FORMS ===================== */
.form-control {
    background: #ffffff;
    border: 1px solid #d1d5db;
    color: #1f2937;
    border-radius: 8px;
    padding: 10px 15px;
    transition: all 0.2s ease;
}

.form-control:focus {
    background: #ffffff;
    border-color: #3b82f6;
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.15);
    color: #1f2937;
}

.form-control::placeholder {
    color: rgba(107, 114, 128, 0.7);
}

/* ===================== BADGES ===================== */
.badge {
    padding: 6px 12px;
    border-radius: 20px;
    font-weight: 600;
}

.badge-primary {
    background: #3b82f6;
    color: white;
}

.badge-danger {
    background: #ef4444;
    color: white;
}

.badge-info {
    background: #0891b2;
    color: white;
}

.badge-success {
    background: #10b981;
    color: white;
}

.badge-warning {
    background: #f59e0b;
    color: white;
}

/* ===================== RESPONSIVE ===================== */
@media(max-width: 1024px) {
    .sidebar {
        width: 220px;
        padding: 15px;
    }
    
    .content {
        margin-left: 230px;
        padding: 20px;
    }
}

@media(max-width: 768px) {
    .sidebar {
        position: fixed;
        left: -220px;
        height: 100vh;
        transition: left 0.3s ease;
    }
    
    .sidebar.show {
        left: 0;
    }
    
    .content {
        margin-left: 0;
        padding: 20px;
    }
}

</style>
</head>

<body>

<!-- FLOATING ORBS -->
<div class="orb one"></div>
<div class="orb two"></div>

<!-- SIDEBAR -->
<div class="sidebar">
    <img src="{% static 'images/logo.png' %}" width="90" alt="Logo">

    <a href="{% url 'admin_dashboard' %}" class="{% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
        <i class="fas fa-chart-line"></i> Dashboard
    </a>
    <a href="{% url 'admin_users' %}" class="{% if request.resolver_match.url_name == 'admin_users' %}active{% endif %}">
        <i class="fas fa-users"></i> Users
    </a>
    <a href="{% url 'admin_chats' %}" class="{% if request.resolver_match.url_name == 'admin_chats' %}active{% endif %}">
        <i class="fas fa-comments"></i> Chats
    </a>
    <a href="{% url 'admin_reports' %}" class="{% if request.resolver_match.url_name == 'admin_reports' %}active{% endif %}">
        <i class="fas fa-flag"></i> Reports
    </a>
    <a href="{% url 'admin_status' %}" class="{% if request.resolver_match.url_name == 'admin_status' %}active{% endif %}">
        <i class="fas fa-image"></i> Status
    </a>
    <a href="{% url 'admin_groups' %}" class="{% if request.resolver_match.url_name == 'admin_groups' %}active{% endif %}">
        <i class="fas fa-layer-group"></i> Groups
    </a>

    <hr>

    <a href="{% url 'logout' %}" style="color: #f5576c;">
        <i class="fas fa-sign-out-alt"></i> Logout
    </a>
</div>

<!-- CONTENT -->
<div class="content">
    {% block content %}{% endblock %}
</div>

<!-- PARTICLE CANVAS -->
<canvas id="particles"></canvas>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.style.position = "fixed";
canvas.style.top = "0";
canvas.style.left = "0";
canvas.style.width = "100%";
canvas.style.height = "100%";
canvas.style.zIndex = "-3";
canvas.style.pointerEvents = "none";

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i = 0; i < 80; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 3 + 1,
        dx: (Math.random() - 0.5) * 1,
        dy: (Math.random() - 0.5) * 1
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for(let p of particles) {

        p.x += p.dx;
        p.y += p.dy;

        if(p.x > canvas.width) p.x = 0;
        if(p.x < 0) p.x = canvas.width;

        if(p.y > canvas.height) p.y = 0;
        if(p.y < 0) p.y = canvas.height;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,215,0,0.5)";
        ctx.fill();
    }

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
