{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-attachment: fixed;
            color: #333;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin-top: 40px;
        }
        
        .edit-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        
        .edit-card h2 {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-control {
            background: rgba(102, 126, 234, 0.05);
            border: 2px solid rgba(102, 126, 234, 0.2);
            color: #333;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
            color: #333;
        }
        
        .form-control::placeholder {
            color: rgba(51, 51, 51, 0.5);
        }
        
        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }
        
        .btn-save {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 12px 30px;
            font-weight: 600;
            border-radius: 10px;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            background: linear-gradient(135deg, #764ba2, #667eea);
            color: white;
        }
        
        .form-label {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="edit-card">
        <h2><i class="fas fa-user-edit"></i> Edit Profile</h2>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
            <input class="form-control" name="full_name" title="Full name" placeholder="Enter your full name" value="{{ profile.full_name }}" required>
            
            <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
            <input class="form-control" name="email" title="Email" placeholder="Enter your email" value="{{ profile.email }}" required>
            
            <label class="form-label"><i class="fas fa-phone"></i> Phone</label>
            <input class="form-control" name="phone" title="Phone" placeholder="Enter your phone number" value="{{ profile.phone }}" required>
            
            <label class="form-label"><i class="fas fa-comment"></i> Status</label>
            <input class="form-control" name="status" title="Status" placeholder="What's on your mind?" value="{{ profile.status }}">
            
            <label class="form-label"><i class="fas fa-pen"></i> Bio</label>
            <textarea class="form-control" name="bio" title="Bio" placeholder="Tell us about yourself">{{ profile.bio }}</textarea>
            
            <label class="form-label"><i class="fas fa-image"></i> Profile Picture</label>
            <input type="file" class="form-control" name="profile_pic" title="Profile picture" accept="image/*">
            
            <button type="submit" class="btn btn-save">
                <i class="fas fa-save"></i> Save Changes
            </button>
        </form>
    </div>
</div>

</body>
</html>
