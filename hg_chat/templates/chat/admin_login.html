{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:'Segoe UI', 'Helvetica Neue', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a5f 100%);
    background-attachment: fixed;
}

/* Professional subtle gradient overlay */
body::before {
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(15, 23, 42, 0.1), transparent 40%);
    z-index:-2;
}

/* Subtle grid pattern */
body::after {
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background-image: linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index:-1;
}

/* Center box */
.login-wrapper {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Professional login card */
.login-box {
    width:400px;
    padding:40px;
    border-radius:12px;
    background:rgba(30, 41, 59, 0.85);
    backdrop-filter:blur(10px);
    border:1px solid rgba(59, 130, 246, 0.2);
    box-shadow:0 10px 40px rgba(0, 0, 0, 0.3);
    animation:fadeIn 0.8s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}

/* Form inputs */
.form-control {
    background:rgba(148, 163, 184, 0.1);
    border:1px solid rgba(59, 130, 246, 0.3);
    color:#e2e8f0;
    border-radius:8px;
    padding:12px 16px;
    transition:all 0.3s ease;
}

.form-control:focus {
    border-color:#3b82f6;
    background:rgba(59, 130, 246, 0.1);
    box-shadow:0 0 15px rgba(59, 130, 246, 0.3);
    color:#e2e8f0;
}

/* Login button */
.btn-gold {
    background:linear-gradient(135deg, #3b82f6, #1e40af);
    border:none;
    font-weight:600;
    transition:all 0.3s ease;
    color:white;
}

.btn-gold:hover {
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(59, 130, 246, 0.4);
    background:linear-gradient(135deg, #1e40af, #3b82f6);
}

/* Title styling */
h4 {
    color:#e2e8f0;
    font-weight:600;
    letter-spacing:0.5px;
}

/* Placeholder text */
.form-control::placeholder {
    color: rgba(226, 232, 240, 0.6);
    opacity: 1;
}

.form-control::-webkit-input-placeholder {
    color: rgba(226, 232, 240, 0.6);
}

.form-control:-ms-input-placeholder {
    color: rgba(226, 232, 240, 0.6);
}

.form-control::-ms-input-placeholder {
    color: rgba(226, 232, 240, 0.6);
}
</style>
</head>

<body>

<div class="login-wrapper">

<div class="login-box">

    <h4 class="text-center mb-4">🔐 Admin Portal</h4>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>
        <input type="password" name="password" class="form-control mb-4" placeholder="Password" required>

        <button type="submit" class="btn btn-gold w-100">Sign In</button>
    </form>

</div>

</div>

</body>
</html>

</body>
</html>
