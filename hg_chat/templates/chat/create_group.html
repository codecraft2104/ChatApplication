{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Group | HG Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eff6ff;
            color: #111827;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
        }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #1d4ed8;
        }

        .form-control {
            background: #f8fafc;
            border: 1px solid #d1d5db;
            color: #111827;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 16px;
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .form-control:focus {
            background: #ffffff;
            border-color: #3b82f6;
            color: #111827;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }

        .btn-gold {
            background: #f59e0b;
            color: #111827;
            font-weight: 700;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            transition: 0.2s ease;
            width: 100%;
        }

        .btn-gold:hover {
            background: #d97706;
            transform: translateY(-1px);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #1d4ed8;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section img {
            width: 80px;
            margin-bottom: 10px;
        }

        .logo-section h3 {
            color: #1d4ed8;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div class="form-container">

    <!-- LOGO -->
    <div class="logo-section">
        <img src="{% static 'images/logo.png' %}" alt="HG Chat logo">
        <h3>HG Chat</h3>
        <p class="text-muted">Create a new group</p>
    </div>

    <!-- FORM -->
    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="groupName" class="form-label">📌 Group Name</label>
            <input 
                type="text" 
                id="groupName"
                name="name" 
                class="form-control" 
                placeholder="Enter group name"
                required
                minlength="3"
                maxlength="100"
            >
        </div>

        <button type="submit" class="btn btn-gold">➕ Create Group</button>
    </form>

    <!-- BACK LINK -->
    <div class="back-link">
        <a href="{% url 'dashboard' %}">← Back to Dashboard</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
