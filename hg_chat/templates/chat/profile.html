{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-attachment: fixed;
            color: #333;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin-top: 40px;
        }
        
        .profile-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        
        .profile-card h2 {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .profile-pic {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: block;
            margin: 0 auto 30px;
            object-fit: cover;
            border: 5px solid #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .profile-info {
            display: grid;
            gap: 15px;
            margin: 25px 0;
        }
        
        .info-item {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.08), rgba(118, 75, 162, 0.03));
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        
        .info-item strong {
            color: #667eea;
            font-weight: 700;
        }
        
        .info-item p {
            margin: 0;
            color: #333;
            word-break: break-word;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            justify-content: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            background: linear-gradient(135deg, #764ba2, #667eea);
            color: white;
        }
        
        .btn-secondary {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 10px 28px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-card">
        <h2><i class="fas fa-user-circle"></i> My Profile</h2>
        
        <img src="{{ profile.profile_pic.url }}" class="profile-pic" alt="Profile Picture">
        
        <div class="profile-info">
            <div class="info-item">
                <strong><i class="fas fa-id-card"></i> HG ID:</strong>
                <p>{{ profile.hg_id }}</p>
            </div>
            
            <div class="info-item">
                <strong><i class="fas fa-user"></i> Name:</strong>
                <p>{{ profile.full_name }}</p>
            </div>
            
            <div class="info-item">
                <strong><i class="fas fa-envelope"></i> Email:</strong>
                <p>{{ profile.email }}</p>
            </div>
            
            <div class="info-item">
                <strong><i class="fas fa-phone"></i> Phone:</strong>
                <p>{{ profile.phone }}</p>
            </div>
            
            <div class="info-item">
                <strong><i class="fas fa-comment"></i> Status:</strong>
                <p>{{ profile.status }}</p>
            </div>
            
            <div class="info-item">
                <strong><i class="fas fa-pen"></i> Bio:</strong>
                <p>{{ profile.bio }}</p>
            </div>
        </div>
        
        <div class="button-group">
            <a href="{% url 'edit_profile' %}" class="btn btn-primary">
                <i class="fas fa-edit"></i> Edit Profile
            </a>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
    </div>
</div>

</body>
</html>
