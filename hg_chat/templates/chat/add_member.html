{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Member | {{ group.name }} | HG Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #1a365d 100%);
            color: #1f2937;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Subtle glow layer */
        body::before {
            content: "";
            position: fixed;
            inset: -50%;
            background:
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.08), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(15, 23, 42, 0.1), transparent 40%);
            animation: moveGlow 14s ease-in-out infinite alternate;
            z-index: -2;
        }

        @keyframes moveGlow {
            from { transform: translate(0,0) scale(1); }
            to { transform: translate(30px,20px) scale(1.05); }
        }

        .form-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
            color: #1f2937;
        }

        .group-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
        }

        .group-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .form-control, .form-select {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #1f2937;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .form-control::placeholder,
        .form-select::placeholder {
            color: #9ca3af;
        }

        .form-control:focus,
        .form-select:focus {
            background: #ffffff;
            border-color: #3b82f6;
            color: #1f2937;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.15);
        }

        .form-select option {
            background: #ffffff;
            color: #1f2937;
        }

        .btn-gold {
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            color: white;
            font-weight: 600;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
            color: white;
        }

        .btn-back {
            background: transparent;
            border: 1px solid #d1d5db;
            color: #3b82f6;
            padding: 12px 30px;
            border-radius: 8px;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 10px;
            font-weight: 500;
        }

        .btn-back:hover {
            background: #f0f9ff;
            border-color: #3b82f6;
            color: #1e40af;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #1f2937;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-section img {
            width: 70px;
            margin-bottom: 8px;
        }

        .logo-section h4 {
            color: #1f2937;
            font-weight: 700;
        }

        .no-members {
            text-align: center;
            padding: 30px;
            background: #f9fafb;
            border-radius: 8px;
            color: #6b7280;
            border: 1px solid #e5e7eb;
        }

        .no-members p {
            color: #1f2937;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="form-container">

    <!-- LOGO -->
    <div class="logo-section">
        <img src="{% static 'images/logo.png' %}" alt="HG Chat logo">
        <h4>HG Chat</h4>
    </div>

    <!-- GROUP INFO -->
    <div class="group-header">
        <div class="group-avatar">
            {{ group.name|slice:":1"|upper }}
        </div>
        <h4 class="mt-2" style="color:#1f2937; font-weight:700;">{{ group.name }}</h4>
        <small style="color:#6b7280;">Add members to this group</small>
    </div>

    <!-- FORM -->
    {% if users %}
    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="userSelect" class="form-label">👥 Select User</label>
            <select 
                id="userSelect"
                name="user" 
                class="form-select" 
                required
                title="Select a user to add"
            >
                <option value="">-- Choose a user --</option>
                {% for u in users %}
                    <option value="{{ u.id }}">{{ u.username }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-gold">➕ Add Member</button>
    </form>

    <a href="{% url 'group_chat' group.id %}" class="btn btn-back">← Back to Group</a>

    {% else %}
    <div class="no-members">
        <p>✅ All available users are already members of this group!</p>
        <a href="{% url 'group_chat' group.id %}" class="btn btn-back mt-3">← Back to Group</a>
    </div>
    {% endif %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
